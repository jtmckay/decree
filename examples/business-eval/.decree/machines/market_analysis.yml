# yaml-language-server: $schema=../schema/machine.schema.json
# Graph: ../graph/market_analysis.md
name: market_analysis
description: First step of a business evaluation. Analyze the market for the idea in the message body, then hand off to competitive_landscape.
data:
  report: { type: string, default: 01-market-analysis.md }   # written to the run folder
initial: precheck
states:
  precheck:                        # fails fast if claude is not on PATH
    invoke: precheck
    transitions: { done: analyze }
  analyze:                         # claude writes the report
    invoke:
      script: { name: analyze, max_attempts: 3 }
    transitions: { done: check_report }
  check_report:                    # the report file exists
    invoke: check_report
    transitions: { done: hand_off }
  hand_off:                        # emits the next step with the idea and the report's path
    invoke:
      script: { name: hand_off, max_attempts: 3 }
    transitions: { done: done }
    emits: [competitive_landscape]
  done:   { final: true }
  failed: { final: true }
