# yaml-language-server: $schema=../schema/v1/machine.schema.json
# Graph: ../graph/competitive_landscape.md
name: competitive_landscape
description: Second step of a business evaluation. Map competitors and positioning, building on the market analysis, then hand off to financial_model.
data:
  report: { type: string, default: 02-competitive-landscape.md }
  market_analysis_path: { type: string, default: "" }
initial: precheck
states:
  precheck:
    invoke: precheck
    transitions: { done: analyze }
  analyze:
    invoke:
      script: { name: analyze, max_attempts: 3 }
    transitions: { done: check_report }
  check_report:
    invoke: check_report
    transitions: { done: hand_off }
  hand_off:
    invoke:
      script: { name: hand_off, max_attempts: 3 }
    transitions: { done: done }
    emits: [financial_model]
  done:   { final: true }
  failed: { final: true }
