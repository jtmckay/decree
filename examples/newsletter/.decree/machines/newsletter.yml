# yaml-language-server: $schema=../schema/v1/machine.schema.json
# Graph: ../graph/newsletter.md
name: newsletter
description: Gather new items from my feeds, pick and summarise the ones that fit my taste, and write the issue.
store:
  seen.tsv: Links already sent, so an item is never in two issues. gather reads it; deliver appends.
initial: gather
states:
  gather:     # new items from lib/newsletter/feeds.txt, by link not in seen.tsv -> items.jsonl
    invoke: gather
    transitions: { done: write }
  write:      # a local model reads lib/newsletter/taste.md and items.jsonl, writes issue.md
    invoke: write
    transitions: { done: deliver }
  deliver:    # issue.md to newsletter/<date>.md, its links to seen.tsv; an ntfy ping if NTFY_URL is set
    invoke: deliver
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
