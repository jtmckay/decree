# yaml-language-server: $schema=../schema/machine.schema.json
# Graph: ../graph/develop_by_size.md
# Route by complexity: a typed classifier (GLiNER2.5-Decide, on CPU, in
# milliseconds) decides whether a change is small enough for a local model
# served by Ollama, or needs Claude. When in doubt, and when local work fails
# verification, Claude does it.
name: develop_by_size
description: Size up a change with a local classifier, implement it with a local model or with Claude, and verify it.
initial: describe
states:
  describe:                        # prints the title, acceptance criteria and named files with line counts
    invoke: describe
    transitions: { done: size_up }

  size_up:                         # typed: the classifier can only pick small or large
    invoke:
      model:
        question: How much reasoning does this change need?
        router: gliner_router
        min_confidence: 0.7
        output: describe
    transitions:
      small:
        target: implement_local
        description: "A local, mechanical change: a typo, a rename, a config value, one small function with a clear spec."
      large:
        target: implement_claude
        description: Design, several files, unclear requirements, concurrency or security.
      unsure: implement_claude     # when in doubt, use the stronger model
      error: implement_claude      # no classifier: use the stronger model

  implement_local:                 # opencode run with a model served by Ollama
    invoke: implement_local
    transitions: { done: verify, error: implement_claude }

  implement_claude:                # claude -p; logs each step in progress.md; writes STOP instead of guessing
    invoke:
      script: { name: implement_claude, max_attempts: 2 }
    transitions: { done: verify, stop: failed }

  verify:                          # $TEST_CMD, cargo test by default
    invoke: verify
    transitions: { done: done, error: tried_claude }

  tried_claude:                    # a failed local attempt escalates to Claude once
    invoke:
      check: { visits: implement_claude, less_than: 1 }
    transitions: { true: implement_claude, false: failed }

  done:   { final: true }
  failed: { final: true }
