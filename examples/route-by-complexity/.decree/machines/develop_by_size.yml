# yaml-language-server: $schema=../schema/v1/machine.schema.json
# Graph: ../graph/develop_by_size.md
# Route by complexity: a typed classifier (GLiNER2.5-Decide, on CPU, in
# milliseconds) decides whether a change is small enough to try first with a
# local model served by Ollama, or needs Claude. Each attempt implements the
# change and runs the tests; a failed attempt moves to the next value, so local
# work that fails the tests goes to Claude in the same state.
name: develop_by_size
description: Size up a change with a local classifier, then implement and test it, locally first or with Claude only, moving to Claude when local attempts fail the tests.
initial: describe
states:
  describe:                        # prints the title, acceptance criteria and named files with line counts
    invoke: describe
    transitions: { done: size_up }

  size_up:                         # typed: the classifier picks where to start; unsure or down goes to Claude
    invoke:
      model:
        question: How much reasoning does this change need?
        router: gliner_router      # or llm_router, for a decision that needs judging
        min_confidence: 0.7
        output: describe
    transitions:
      small:
        target: local_first
        description: "A local, mechanical change: a typo, a rename, a config value, one small function with a clear spec."
      large:
        target: claude_only
        description: Design, several files, unclear requirements, concurrency or security.
      unsure: claude_only          # when in doubt, use the stronger model
      error: claude_only           # no classifier: use the stronger model

  local_first:                     # each attempt implements, then runs the tests; a failure moves to the next
    invoke:
      script: { name: implement, attempts: [local, local, claude] }
    transitions: { done: done, stop: failed }

  claude_only:                     # each attempt runs claude -p, then the tests
    invoke:
      script: { name: implement, attempts: [claude, claude] }
    transitions: { done: done, stop: failed }

  done:   { final: true }
  failed: { final: true }
