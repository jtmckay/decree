# yaml-language-server: $schema=../schema/machine.schema.json
# Graph: ../graph/transcribe.md
name: transcribe
description: Transcribe an audio file with OpenAI Whisper into a .txt file.
data:
  input_file: { type: string, default: "" }    # required: the audio file to transcribe
  output_file: { type: string, default: "" }   # default: input_file with a .txt extension
  model: { type: string, default: large }      # Whisper model
initial: precheck
states:
  precheck:                        # fails fast if whisper or the input file is missing
    invoke: precheck
    transitions: { done: transcribe }
  transcribe:
    invoke:
      script: { name: transcribe, max_attempts: 3 }
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
