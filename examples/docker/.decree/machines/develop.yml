# Graph: ../graph/develop.md
name: develop
description: Implement a message with opencode, then have it verify the acceptance criteria.
initial: precheck
states:
  precheck:                        # fails fast if opencode is not on PATH
    invoke: precheck
    max_attempts: 1
    transitions: { done: implement }
  implement:
    invoke: implement
    max_attempts: 3
    transitions: { done: verify }
  verify:                          # opencode checks the acceptance criteria and fixes what fails
    invoke: verify
    max_attempts: 3
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
