# yaml-language-server: $schema=../schema/machine.schema.json
# Graph: ../graph/illustrated_post.md
# Services in tmux sessions (README.md): use_<service> uses the service's tmux
# session or starts it, then waits until it answers; without_<service> ends it.
# GLiNER runs on CPU and stays up; ComfyUI and Ollama share the GPU, so a state
# that needs one lists without_<the other> first.
name: illustrated_post
description: Write a short post from the message, with a picture when the message asks for one.
onentry: [use_gliner]              # root onentry: GLiNER is needed first, and stays up
initial: needs_picture
states:
  needs_picture:                   # typed: the classifier can only pick with_picture or text_only
    invoke:
      model:
        question: Does this post need a picture?
        router: gliner_router
        min_confidence: 0.7
    transitions:
      with_picture:
        target: render
        description: The message asks for a picture, an image or an illustration to go with the post.
      text_only:
        target: write
        description: The message asks for text only, with no picture.
      unsure: write                # when in doubt, text only: no GPU switch

  render:                          # queues the FLUX2 workflow and returns; ComfyUI renders in the background
    invoke: render
    onentry: [without_ollama, use_comfy]          # Ollama is idle (decree waits on it): end it, then ComfyUI
    transitions: { done: write }

  write:                           # asks Ollama for the post, writes post.md
    invoke: write
    onentry: [without_comfy_wait, use_ollama]     # ComfyUI's queue drains and it ends, then Ollama
    transitions: { done: done }

  done:   { final: true }
  failed: { final: true }
