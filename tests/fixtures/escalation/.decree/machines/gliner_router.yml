# Graph: ../graph/gliner_router.md
# A typed router (docs/routers.md): GLiNER2.5-Decide, a classifier, picks one of
# the option labels it is given, so its answer is always an option and its
# confidence is the classifier's score. The classifier runs as a long-running
# service (examples/route-by-complexity/gliner/); this machine only talks to it.
name: gliner_router
description: Ask the local GLiNER2.5-Decide classifier to pick one of the options in the request.
initial: ask
states:
  ask:                             # posts the question, options and input; writes $DECREE_REPLY
    invoke: ask_gliner
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
