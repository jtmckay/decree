name: step_compound
description: Enter a compound state through its initial, then leave it from its child.
onentry: [root_entry]
onexit: [root_exit]
initial: outer
states:
  outer:
    onentry: [outer_entry]
    onexit: [outer_exit]
    initial: inner
    states:
      inner:
        invoke: inner_invoke
        onentry: [inner_entry]
        onexit: [inner_exit]
        transitions: { done: after }
  after:
    invoke: after_invoke
    onentry: [after_entry]
    onexit: [after_exit]
    transitions: { done: done }
  done:   { final: true, onentry: [done_entry] }
  failed: { final: true, onentry: [failed_entry] }
