name: step_error
description: An invoke fails and nothing handles error.
onentry: [root_entry]
onexit: [root_exit]
initial: a
states:
  a:
    invoke: a_invoke_fail
    onentry: [a_entry]
    onexit: [a_exit]
    transitions: { done: done }
  done:   { final: true, onentry: [done_entry] }
  failed: { final: true, onentry: [failed_entry] }
