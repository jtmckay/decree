name: step_normal
description: Two states, the second a pass-through, then a final state.
onentry: [root_entry]
onexit: [root_exit]
initial: a
states:
  a:
    invoke: a_invoke
    onentry: [a_entry]
    onexit: [a_exit]
    transitions: { done: b }
  b:
    onentry: [b_entry]
    onexit: [b_exit]
    transitions: { done: done }
  done:   { final: true, onentry: [done_entry] }
  failed: { final: true, onentry: [failed_entry] }
