name: step_root_entry_fail
description: A root onentry script fails, though the state handles error itself.
onentry: [root_entry_fail, root_entry]
onexit: [root_exit]
initial: a
states:
  a:
    onentry: [a_entry]
    invoke: a_invoke
    onexit: [a_exit]
    transitions: { done: done, error: done }
  done:   { final: true, onentry: [done_entry] }
  failed: { final: true, onentry: [failed_entry] }
