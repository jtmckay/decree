name: step_root_entry_fail
description: A root onentry script fails, and the state entered handles error.
onentry: [root_entry_fail, root_entry]
onexit: [root_exit]
initial: a
states:
  a:
    invoke: a_invoke
    onentry: [a_entry]
    onexit: [a_exit]
    transitions: { done: done, error: cleanup }
  cleanup:
    onentry: [cleanup_entry]
    transitions: { done: done }
  done:   { final: true, onentry: [done_entry] }
  failed: { final: true, onentry: [failed_entry] }
