name: step_waiting
description: Build, wait inside a compound state for a person, then ship.
onentry: [root_entry]
onexit: [root_exit]
initial: build
states:
  build:
    invoke: build_invoke
    transitions: { done: gate }
  gate:
    onentry: [gate_entry]
    onexit: [gate_exit]
    initial: approval
    transitions: { cancel: cancelled }
    states:
      approval:                          # waits: no invoke, no done
        description: A person sends approve or reject.
        onentry: [ask_person]
        onexit: [approval_exit]
        timeout_s: 60
        transitions: { approve: ship, reject: rejected }
  ship:
    onentry: [ship_entry]
    invoke: ship_invoke
    transitions: { done: done }
  rejected:  { final: true, onentry: [rejected_entry] }
  cancelled: { final: true, onentry: [cancelled_entry] }
  done:      { final: true, onentry: [done_entry] }
  failed:    { final: true, onentry: [failed_entry] }
