name: step_router
description: A router state whose conds can leave only the default.
data:
  open: { type: bool, default: true }
initial: verify
states:
  verify:
    description: Tests have run; decide what happens next.
    invoke: verify
    router: llm
    default: ask
    transitions:
      ask:   { target: asked, description: Not sure; ask a person. }
      pass:  { target: done, description: All acceptance criteria are met., cond: "data.open == true" }
      retry: { target: retried, description: Failures look fixable., cond: "data.open == true" }
  asked:   { final: true }
  retried: { final: true }
  done:    { final: true }
  failed:  { final: true }
