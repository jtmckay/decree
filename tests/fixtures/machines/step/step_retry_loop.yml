name: step_retry_loop
description: Implement, then verify, and implement again while fewer than 2 rounds ran.
initial: implement
states:
  implement:
    invoke: fail_until_final
    max_attempts: 2
    transitions: { done: verify }
  verify:
    invoke: verify
    transitions: { done: rounds_left }
  rounds_left:
    invoke: { check: { visits: implement, less_than: 2 } }
    transitions: { yes: implement, no: done }
  done:   { final: true }
  failed: { final: true }
