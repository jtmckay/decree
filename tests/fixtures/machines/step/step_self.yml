name: step_self
description: A router state that can transition to itself.
onentry: [root_entry]
onexit: [root_exit]
initial: a
states:
  a:
    description: Decide whether to run a again.
    onentry: [a_entry]
    invoke: a_invoke
    onexit: [a_exit]
    router: llm
    default: finish
    transitions:
      again:  { target: a, description: Run a again. }
      finish: { target: done, description: Finish the run. }
  done:   { final: true, onentry: [done_entry] }
  failed: { final: true, onentry: [failed_entry] }
