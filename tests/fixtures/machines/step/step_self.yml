name: step_self
description: A check state that transitions to itself until it has been entered twice.
onentry: [root_entry]
onexit: [root_exit]
initial: a
states:
  a:
    onentry: [a_entry]
    invoke: { check: { visits: a, less_than: 2 } }
    onexit: [a_exit]
    transitions: { yes: a, no: done }
  done:   { final: true, onentry: [done_entry] }
  failed: { final: true, onentry: [failed_entry] }
