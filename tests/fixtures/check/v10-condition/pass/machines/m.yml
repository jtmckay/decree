name: m
description: A check on visits against data.
data:
  max_rounds: { type: int, default: 2 }
initial: work
states:
  work:
    invoke: work
    transitions: { done: again }
  again:
    invoke: { check: { visits: work, less_than: { data: max_rounds } } }
    transitions: { yes: work, no: done }
  done: { final: true }
  failed: { final: true }
