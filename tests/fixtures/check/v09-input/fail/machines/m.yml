name: m
description: A check on the output of a state that runs no script.
initial: work
states:
  work:
    invoke: work
    transitions: { done: ok }
  ok:
    invoke: { check: { matches: "^ok" }, input: ok }
    transitions: { yes: done, no: work }
  done: { final: true }
  failed: { final: true }
