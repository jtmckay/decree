name: m
description: A compound state that handles its own completion by its full name.
initial: work
states:
  work:
    initial: step
    transitions: { done.state.work: done, error: failed }
    states:
      step:
        invoke: work
        transitions: { done: finished }
      finished: { final: true }
  done: { final: true }
  failed: { final: true }
