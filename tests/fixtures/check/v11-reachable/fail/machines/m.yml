name: m
description: A machine with an unreachable state and a stall.
initial: work
states:
  work:
    invoke: work
    transitions: { done: done, hold: wait }
  wait:
    invoke: { check: { visits: wait, less_than: 2 } }
    transitions: { yes: wait, no: wait }
  orphan:
    invoke: work
    transitions: { done: done }
  done: { final: true }
  failed: { final: true }
