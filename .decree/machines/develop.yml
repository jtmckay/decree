# Graph: ../graph/develop.md
name: develop
description: Implement a message with Claude, then have it verify the acceptance criteria.
initial: precheck
states:
  precheck:                        # fails fast if claude is not on PATH
    invoke: precheck
    max_attempts: 1
    transitions: { done: implement }
  implement:                       # waits out a usage limit and resumes the session
    invoke: implement
    max_attempts: 3
    transitions: { done: verify }
  verify:                          # Claude checks the requirements and runs the tests
    invoke: verify
    max_attempts: 3
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
