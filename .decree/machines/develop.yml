name: develop
description: Implement a message with the AI in small, logged steps, run the project's gate, have the AI fix failures only if the gate fails, then have the AI check the acceptance criteria.
onentry:
- clean_tree
initial: precheck
states:
  precheck:
    invoke: precheck
    transitions:
      done: implement
  implement:
    invoke:
      script:
        name: implement
        attempts: 3
    transitions:
      done: gate
      stop: failed
  gate:
    invoke: gate
    transitions:
      pass: verify
      fail: fix
  fix:
    invoke:
      script:
        name: fix
        attempts: 3
    transitions:
      done: final_gate
      stop: failed
  final_gate:
    invoke: gate
    transitions:
      pass: verify
      fail: failed
  verify:
    invoke:
      script:
        name: verify
        attempts: 3
    transitions:
      pass: done
      fail: failed
      stop: failed
  done:
    final: true
    onentry:
    - commit
    - restart
  failed:
    final: true
    onentry:
    - keep
