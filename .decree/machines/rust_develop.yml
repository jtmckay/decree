# Graph: ../graph/rust_develop.md
name: rust_develop
description: Implement a message in a Rust project with Claude, build and test it, then have Claude fix any failures.
initial: precheck
states:
  precheck:                        # fails fast if claude or cargo is not on PATH
    invoke: precheck
    max_attempts: 1
    transitions: { done: implement }
  implement:                       # waits out a usage limit and resumes the session
    invoke: implement
    max_attempts: 3
    transitions: { done: build }
  build:                           # a failed build goes to qa, which fixes it
    invoke: build
    max_attempts: 1
    transitions: { done: test, error: test }
  test:                            # failed tests go to qa too
    invoke: test
    max_attempts: 1
    transitions: { done: qa, error: qa }
  qa:                              # Claude reads build.log and test-output.log and fixes failures
    invoke: qa
    max_attempts: 3
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
