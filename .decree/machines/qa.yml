name: qa
description: Attack the project to make it misbehave, and hand each real bug to develop as a failing test; the AI writes tests only and never fixes code.
onentry:
- clean_tree
initial: recon
states:
  recon:
    invoke: recon
    transitions:
      done: attack
  attack:
    invoke: attack
    transitions:
      done: run
  run:
    invoke: run
    transitions:
      done: triage
  triage:
    invoke: triage
    transitions:
      done: report
      stop: failed
  report:
    invoke: report
    transitions:
      done: done
    emits:
    - develop
  done:
    final: true
    onentry:
    - commit
  failed:
    final: true
    onentry:
    - keep
