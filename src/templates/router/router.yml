# yaml-language-server: $schema=../schema/v1/machine.schema.json
# Graph: ../graph/router.md
name: router
description: Ask {ai_title} to pick one of the options in the request.
initial: ask
states:
  ask:                             # renders the prompt from $DECREE_REQUEST, runs {ai_cli}, writes $DECREE_REPLY
    invoke:                        # a reply that is not one of the options fails the script; it runs once more
      script: { name: ask_{ai}, attempts: 2 }
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
