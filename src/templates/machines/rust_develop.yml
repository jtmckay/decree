# Graph: ../graph/rust_develop.md
name: rust_develop
description: Implement a message in a Rust project with {ai_title}, build and test it, then have {ai_title} fix any failures.
initial: precheck
states:
  precheck:                        # fails fast if {ai} or cargo is not on PATH
    invoke: precheck
    max_attempts: 1
    transitions: { done: implement }
  implement:                       # waits out a usage limit and resumes the session
    invoke: implement
    transitions: { done: build }
  build:                           # a failed build goes to qa, which fixes it
    invoke: build
    max_attempts: 1
    transitions: { done: test, error: test }
  test:                            # failed tests go to qa too
    invoke: test
    max_attempts: 1
    transitions: { done: qa, error: qa }
  qa:                              # {ai_title} reads build.log and test-output.log and fixes failures
    invoke: qa
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
