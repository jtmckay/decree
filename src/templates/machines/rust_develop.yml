# Graph: ../graph/rust_develop.md
name: rust_develop
description: Implement a message in a Rust project with {ai_title} in small, logged steps, run the gate (fmt, clippy, tests), and have {ai_title} fix failures only if the gate fails.
initial: precheck
states:
  precheck:                        # fails fast if {ai} or cargo is not on PATH
    invoke: precheck
    transitions: { done: implement }
  implement:                       # logs each step in progress.md; writes STOP instead of guessing
    invoke:
      script: { name: implement, max_attempts: 3 }
    transitions: { done: gate, stop: failed }
  gate:                            # cargo fmt --check, clippy -D warnings and test, kept in gate.log
    invoke: gate
    transitions: { done: done, error: qa }
  qa:                              # {ai_title} fixes what gate.log reports
    invoke:
      script: { name: qa, max_attempts: 3 }
    transitions: { done: final_gate, stop: failed }
  final_gate:                      # the gate again; if it fails, so does the run
    invoke: gate
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
