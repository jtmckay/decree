# Graph: ../graph/develop.md
name: develop
description: Implement a message with {ai_title}, then have it verify the acceptance criteria.
initial: precheck
states:
  precheck:                        # fails fast if {ai} is not on PATH
    invoke: precheck
    transitions: { done: implement }
  implement:                       # waits out a usage limit and resumes the session
    invoke:
      script: { name: implement, max_attempts: 3 }
    transitions: { done: verify }
  verify:                          # {ai_title} checks the requirements and runs the tests
    invoke:
      script: { name: verify, max_attempts: 3 }
    transitions: { done: done }
  done:   { final: true }
  failed: { final: true }
