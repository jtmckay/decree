# Graph: ../graph/sort_document.md
# An escalation ladder: the cheapest way to decide goes first, and each step
# passes on only what it cannot decide. A `check` says `no`; a model below its
# min_confidence says `unsure`. Free and certain, free and likely, a small
# local model, a large model, then a person.
name: sort_document
description: File one scanned document as an invoice, a receipt or other paperwork.
data:
  file: { type: string, default: "" }   # the scan's path, from the message's params
initial: by_name
states:
  # 1. Free and certain: the accounting system names its invoices.
  by_name:
    invoke: { check: { data: file, matches: '^scans/invoice-[0-9]+\.pdf$' } }
    transitions: { yes: file_invoice, no: read_text }

  read_text:                       # prints the scan's text; what every later step reads
    invoke: extract_text
    transitions: { done: by_text }

  # 2. Free and likely: wording only invoices have.
  by_text:
    invoke: { check: { matches: '(?i)invoice (no|number)[.:]' }, input: read_text }
    transitions: { yes: file_invoice, no: local_model }

  # 3. Cheap: a small classifier on this machine. Sure enough (0.9 or more) -> act.
  local_model:
    invoke: { choose: model, router: local_router, question: "Which kind of document is this?", min_confidence: 0.9, input: read_text }
    transitions:
      invoice: { target: file_invoice, description: "A bill asking for payment, with an amount due." }
      receipt: { target: file_receipt, description: "Proof of a payment already made." }
      other:   { target: file_other,   description: "Any other paperwork." }
      unsure:  { target: big_model }

  # 4. Costly: the default router's large model. Sure enough (0.7 or more) -> act.
  big_model:
    invoke: { choose: model, question: "Which kind of document is this?", min_confidence: 0.7, input: read_text }
    transitions:
      invoice: { target: file_invoice, description: "A bill asking for payment, with an amount due." }
      receipt: { target: file_receipt, description: "Proof of a payment already made." }
      other:   { target: file_other,   description: "Any other paperwork." }
      unsure:  { target: worth_asking }

  # 5. Bands: below 0.7 but at least 0.4 is worth a person's time; lower is set aside.
  worth_asking:
    invoke: { check: { confidence: big_model, at_least: 0.4 } }
    transitions: { yes: ask_person, no: set_aside }

  # 6. A person decides; the run waits for their reply.
  ask_person:
    invoke: { choose: person, question: "Which kind of document is this?", ask: ask_person, timeout_s: 604800 }
    transitions:
      invoice: { target: file_invoice, description: "A bill asking for payment, with an amount due." }
      receipt: { target: file_receipt, description: "Proof of a payment already made." }
      other:   { target: file_other,   description: "Any other paperwork." }
      error:   { target: set_aside }   # no reply within a week

  file_invoice: { invoke: file_away, transitions: { done: done } }   # file_away moves the scan
  file_receipt: { invoke: file_away, transitions: { done: done } }   # to the folder its state
  file_other:   { invoke: file_away, transitions: { done: done } }   # names ($DECREE_STATE)
  done:      { final: true }
  set_aside: { final: true }       # left in scans/; the decisions are in events.jsonl
  failed:    { final: true }
