# 0.4's global router, rebuilt as an ordinary machine: a model picks an option,
# and the target state's script forwards the message with `decree emit`.
name: triage
description: Read a free-form request and hand it to the machine that should do the work.
initial: classify
states:
  classify:                        # a model picks one option; if it fails twice: error -> failed
    description: The request is in the message body. Decide which kind of work it is.
    invoke: { choose: model, question: "What kind of work is this request?" }
    transitions:
      small_change: { target: to_develop, description: "A small, self-contained code change with no formal spec." }
      feature:      { target: to_feature, description: A feature with acceptance criteria that should be verified and committed. }
      reject:       { target: rejected,   description: "Not actionable, or not a code change." }
  to_develop:
    invoke: forward
    emits: [develop]
    transitions: { done: done }
  to_feature:
    invoke: forward
    emits: [feature]
    transitions: { done: done }
  done:     { final: true }
  rejected: { final: true }
  failed:   { final: true }
