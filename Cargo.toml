[package]
name = "decree"
version = "0.5.0-beta.5"
edition = "2021"
description = "Durable state-machine workflows from plain files, for scripts, AI agents and people"
license = "MIT"
repository = "https://github.com/jtmckay/decree"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1"
chrono = "0.4"
thiserror = "2"
colored = "3"
signal-hook = "0.3"
libc = "0.2"
cron = "0.15"
regex = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
jsonschema = { version = "0.58", default-features = false }
